name: Client checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go generate ./...
      - run: git diff --exit-code -- generated/api.gen.go
      - run: go test -race ./...
      - run: go vet ./...
